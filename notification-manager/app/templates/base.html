<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .app-header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 1rem 0; margin-bottom: 1.5rem; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card-header { background: #fff; border-bottom: 1px solid #f0f0f0; font-weight: 600; }
    .member-badge { background: #e8f4fd; color: #0c63e4; border-radius: 20px; padding: 2px 10px; font-size: .8rem; font-weight: 500; }
    .snooze-active { background: #fff8e1 !important; }
    .nav-tabs .nav-link { color: #6c757d; border: none; padding: .6rem 1.2rem; }
    .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 2px solid #0d6efd; background: none; font-weight: 600; }
    .nav-tabs { border-bottom: 1px solid #dee2e6; margin-bottom: 1.5rem; }
    .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; font-weight: 600; }
    code { background: #f8f9fa; padding: 2px 6px; border-radius: 4px; font-size: .8rem; color: #c7254e; }
  </style>
</head>
<body>
  <div class="app-header">
    <div class="container">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-bell-fill text-primary fs-4"></i>
        <h1 class="h5 mb-0 fw-bold">Notification Manager</h1>
      </div>
    </div>
  </div>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
